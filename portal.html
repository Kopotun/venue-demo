<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>КРЫМ terrace · рабочий стол</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  /* нейтрали тёплые: база не белая, чёрный не фальшивый */
  --paper:#f4f2f1;
  --surface:#ffffff;
  --surface-2:#edeae6;
  --surface-3:#e5e1db;
  --line:#dfdad4;
  --line-2:#c9c2ba;
  --ink:#353230;
  --ink-2:#6b655e;
  --ink-3:#9a938a;
  /* единственный металлический акцент — бренд и активное состояние */
  --bronze:#967850;
  --bronze-deep:#6f5836;
  --bronze-wash:#96785014;
  --bronze-line:#9678504d;
  /* семантика: wash / line / text выводятся из одного цвета */
  --ok:#2c6a47;      --ok-wash:#2c6a4714;   --ok-line:#2c6a4740;
  --warn:#8a6a1f;    --warn-wash:#8a6a1f14; --warn-line:#8a6a1f40;
  --bad:#9e2e2e;     --bad-wash:#9e2e2e14;  --bad-line:#9e2e2e40;
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,monospace;
  --row:36px;
  --sidebar:242px;
}
*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.55}
button{font:inherit; color:inherit}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--bronze); outline-offset:2px}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}

/* ─── каркас ─── */
.app{display:grid; grid-template-columns:var(--sidebar) minmax(0,1fr); min-height:100dvh}
.side{
  position:sticky; top:46px; align-self:start; height:calc(100dvh - 46px); overflow:auto;
  background:var(--paper); border-right:1px solid var(--line); padding:18px 12px 20px;
  display:flex; flex-direction:column; gap:2px;
}
.mark{display:flex; align-items:center; gap:10px; padding:4px 10px 20px}
.mark__sq{width:30px; height:30px; flex:none; border:1px solid var(--bronze); color:var(--bronze); display:grid; place-items:center; font-size:11px; font-weight:600; letter-spacing:.04em}
.mark__n{font-size:14px; font-weight:600; line-height:1.15; white-space:nowrap}
.mark__a{display:block; font-size:11px; color:var(--ink-3); font-weight:400; margin-top:2px}
.sgroup{font-size:11px; color:var(--ink-3); padding:16px 10px 6px}
.slink{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left; cursor:pointer;
  padding:7px 10px; border:1px solid transparent; border-radius:5px; background:none; font-size:14px; color:var(--ink-2);
}
.slink:hover{background:var(--surface-2); color:var(--ink)}
.slink[aria-current="true"]{background:var(--surface); border-color:var(--line); color:var(--ink); font-weight:500}
.slink[aria-current="true"] .slink__b{background:var(--bronze)}
.slink__b{width:3px; height:15px; border-radius:2px; background:transparent; flex:none}
.slink__c{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--bad); background:var(--bad-wash); padding:1px 6px; border-radius:3px}

.main{min-width:0; display:flex; flex-direction:column}
.strip{background:var(--warn-wash); border-bottom:1px solid var(--warn-line); padding:8px 26px; font-size:12.5px; color:#75581a; line-height:1.5}
.strip b{font-weight:600}
.head{padding:26px 26px 0; display:flex; align-items:flex-start; gap:20px; flex-wrap:wrap}
.head__t{font-size:22px; font-weight:600; letter-spacing:-.015em; margin:0 0 5px}
.head__s{margin:0; color:var(--ink-2); font-size:14px; max-width:74ch}
.head__r{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.body{padding:22px 26px 60px}
.note{margin:0 0 18px; padding:11px 14px; background:var(--warn-wash); border:1px solid var(--warn-line); border-radius:5px; font-size:13px; color:#75581a; line-height:1.55}
.note b{font-weight:600}

/* ─── элементы ─── */
.seg{display:inline-flex; border:1px solid var(--line); border-radius:5px; overflow:hidden; background:var(--surface)}
.seg button{height:30px; padding:0 12px; border:none; border-left:1px solid var(--line); background:none; color:var(--ink-2); cursor:pointer; font-size:13px}
.seg button:first-child{border-left:none}
.seg button:hover{background:var(--surface-2); color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--paper); font-weight:500}
.btn{height:30px; padding:0 12px; border:1px solid var(--line); background:var(--surface); border-radius:5px; cursor:pointer; font-size:13px; display:inline-flex; align-items:center; gap:6px}
.btn:hover{border-color:var(--bronze); color:var(--bronze-deep)}
.btn--go{background:var(--bronze); border-color:var(--bronze); color:#fff; font-weight:500}
.btn--go:hover{background:var(--bronze-deep); color:#fff}
.btn--q{border-color:transparent; background:none; color:var(--ink-2)}
.btn--q:hover{background:var(--surface-2); border-color:transparent; color:var(--ink)}
.chip{display:inline-flex; align-items:center; gap:5px; height:21px; padding:0 7px; border-radius:3px; font-size:11.5px; font-weight:500; white-space:nowrap; border:1px solid}
.chip--ok{background:var(--ok-wash); border-color:var(--ok-line); color:var(--ok)}
.chip--warn{background:var(--warn-wash); border-color:var(--warn-line); color:var(--warn)}
.chip--bad{background:var(--bad-wash); border-color:var(--bad-line); color:var(--bad)}
.chip--flat{background:var(--surface-2); border-color:var(--line); color:var(--ink-2)}

/* ─── «как это посчитано» ─── */
.qm{width:15px; height:15px; padding:0; margin-left:6px; border:1px solid var(--line-2); border-radius:50%;
    background:var(--surface); color:var(--ink-3); font-size:9.5px; font-family:var(--sans); line-height:1;
    cursor:pointer; display:inline-grid; place-items:center; vertical-align:1px; flex:none}
.qm:hover{border-color:var(--bronze); color:var(--bronze-deep); background:var(--bronze-wash)}
.qm[aria-expanded="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.qpop{position:absolute; z-index:80; width:min(320px,calc(100vw - 24px)); background:#2b2724; color:#ece7e0;
      font-size:12.5px; line-height:1.55; padding:11px 13px; border-radius:6px; box-shadow:0 8px 28px rgba(20,18,16,.3)}
.qpop b{color:#fff; font-weight:600}
.qpop i{font-style:normal; color:#b9afa2}

/* ─── показатели ─── */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(172px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:6px; overflow:hidden; margin-bottom:22px}
.kpi{background:var(--surface); padding:14px 16px 15px}
.kpi__k{font-size:12px; color:var(--ink-2); display:block; margin-bottom:8px}
.kpi__v{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:25px; font-weight:500; line-height:1; letter-spacing:-.02em; display:block}
.kpi__v i{font-style:normal; font-family:var(--sans); font-size:13px; color:var(--ink-2); font-weight:400}
.kpi__d{display:block; margin-top:8px; font-size:12px; color:var(--ink-3)}
.kpi__d b{font-family:var(--mono); font-weight:500}
.up{color:var(--ok)} .down{color:var(--bad)}

/* ─── панель ─── */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:6px; margin-bottom:22px}
.panel__h{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:13px 16px; border-bottom:1px solid var(--line)}
.panel__t{font-size:13.5px; font-weight:600; margin:0}
.panel__s{font-size:12.5px; color:var(--ink-3)}
.panel__a{margin-left:auto; display:flex; gap:7px; align-items:center; flex-wrap:wrap}
.panel__b{padding:16px}
.panel__b--flush{padding:0}
.cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:22px; align-items:start}

/* ─── таблицы ─── */
.scroll{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:13px}
th,td{padding:0 12px; height:var(--row); text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
thead th{font-size:11.5px; font-weight:600; color:var(--ink-2); height:32px; background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums}
th[data-s]{cursor:pointer; user-select:none}
th[data-s]:hover{color:var(--ink)}
th[aria-sort]{color:var(--bronze-deep)}
tr[data-hole="1"] td{background:var(--warn-wash)}
tr[data-hole="1"]:hover td{background:#f5ecd8}
tfoot td{height:34px; font-weight:600; background:var(--surface-2); border-top:1px solid var(--line-2); border-bottom:none}
.wrapok{white-space:normal; min-width:200px}

/* ─── полосы ─── */
.bars{list-style:none; margin:0; padding:0}
.bars li{display:grid; grid-template-columns:minmax(0,1fr) 62px; gap:14px; align-items:center; padding:7px 0}
.bars__l{font-size:12.5px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-bottom:5px}
.bars__t{display:block; height:8px; background:var(--surface-3); border-radius:2px; overflow:hidden}
.bars__f{display:block; height:100%; background:var(--bronze); opacity:.9}
.bars li[data-hole="1"] .bars__f{background:var(--warn)}
.bars__n{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:13px; font-weight:500}

/* ─── воронка ─── */
.fun{list-style:none; margin:0; padding:0}
.fun li{display:grid; grid-template-columns:minmax(104px,1fr) minmax(0,1.3fr) 54px; gap:12px; align-items:center; padding:5px 0; font-size:12.5px}
.fun__l{color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.fun__t{height:18px; background:var(--surface-3); border-radius:2px; overflow:hidden}
.fun__f{display:block; height:100%; background:var(--ink-3); min-width:2px}
.fun li[data-drop="1"] .fun__f{background:var(--bad)}
.fun li[data-drop="1"] .fun__l{color:var(--bad); font-weight:600}
.fun__n{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:500}

/* ─── сотрудники: часы и смены за месяц ─── */
.mon{display:grid; min-width:1215px; font-size:12px}
.mon__c{border-bottom:1px solid var(--line)}
.mon__d{padding:0 0 7px; text-align:center; border-bottom:1px solid var(--line)}
.mon__dn{color:var(--bad); font-weight:600}
.mon__d--bad .mon__dw{color:var(--bad)}
.daybar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:13px 16px; border-bottom:1px solid var(--line); background:var(--surface-2); font-size:13px}
.daybar b{font-weight:600}
.daybar button{height:26px; padding:0 10px; border:1px solid var(--bad-line); background:var(--bad-wash); color:var(--bad); border-radius:4px; cursor:pointer; font-size:12.5px; font-weight:500}
.daybar button:hover{background:#f6e2e2}
.mon__dn{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12.5px; color:var(--ink)}
.mon__dw{font-size:10px; color:var(--ink-3); display:block}
.mon__d--we .mon__dn{color:var(--ink-3)}
.mon__d--now .mon__dn{color:var(--bronze-deep); font-weight:600}
.mon__g{grid-column:1/-1; font-size:11px; color:var(--ink-3); padding:14px 0 5px}
.mon__n{display:flex; flex-direction:column; justify-content:center; padding:4px 10px 4px 0; border-bottom:1px solid var(--line); min-height:34px; font-size:12.5px}
.mon__r{font-size:10.5px; color:var(--ink-3)}
.mon__x{border-bottom:1px solid var(--line); border-left:1px solid var(--line); padding:3px; display:grid; place-items:center}
.mon__x--we{background:var(--surface-2)}
.mon__s{width:100%; height:22px; border-radius:2px; cursor:pointer; font-family:var(--mono); font-size:9.5px; letter-spacing:-.02em; font-weight:500; display:grid; place-items:center; border:1px solid}
.mon__s:hover{filter:brightness(.96)}
.mon__e{width:100%; height:22px; border:none; background:none; cursor:pointer; border-radius:2px}
.mon__e:hover{background:var(--bronze-wash)}
.mon__tot{display:grid; place-items:center; border-bottom:1px solid var(--line); border-left:1px solid var(--line); font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12.5px; font-weight:500}
.mon__tot--over{color:var(--bad)}
.draft{border-style:dashed}
.legend{display:flex; gap:18px; flex-wrap:wrap; padding:14px 16px 0; font-size:12px; color:var(--ink-2)}
.legend i{width:18px; height:12px; border-radius:2px; display:inline-block; margin-right:6px; vertical-align:-2px; border:1px solid}

/* ─── цвет смены = подразделение, пунктир = черновик ─── */
.dp-cc{background:#e7efe9; border-color:#a9c6b6; color:#255c3d}
.dp-mg{background:#eae7f0; border-color:#bfb6d1; color:#4b4162}
.dp-bq{background:#f5eedd; border-color:#dcc79c; color:#70561a}

/* ─── месяц: календарная сетка ─── */
.mcal{display:grid; grid-template-columns:repeat(7,minmax(118px,1fr)); min-width:880px; border-top:1px solid var(--line)}
.mcal__h{font-size:11px; color:var(--ink-2); padding:6px 9px; background:var(--surface-2); border-left:1px solid var(--line); border-bottom:1px solid var(--line)}
.mcal__h:first-child{border-left:none}
.mcal__c{position:relative; min-height:126px; padding:5px 5px 8px; border-left:1px solid var(--line); border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:3px; cursor:pointer}
.mcal__c:nth-child(7n+1){border-left:none}
.mcal__c--we{background:var(--surface-2)}
.mcal__c--out{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--paper) 6px 12px); cursor:default}
.mcal__c:hover{background:#fbfaf9}
.mcal__c--we:hover{background:var(--surface-3)}
.mcal__c[data-drop="on"]{background:var(--bronze-wash); box-shadow:inset 0 0 0 1px var(--bronze)}
.mcal__t{display:flex; align-items:center; gap:6px; margin-bottom:3px}
.mcal__n{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12.5px; min-width:21px; height:21px; display:grid; place-items:center; border-radius:50%}
.mcal__c--now .mcal__n{background:var(--bronze); color:#fff; font-weight:500}
.mcal__s{font-size:10.5px; color:var(--ink-3); font-family:var(--mono); white-space:nowrap; overflow:hidden}
.mcal__s .q{font-style:normal}
.mcal__a{margin-left:auto; width:20px; height:20px; flex:none; border:none; background:none; color:var(--ink-3); border-radius:4px; cursor:pointer; font-size:15px; line-height:1; opacity:0}
.mcal__c:hover .mcal__a{opacity:1}
.mcal__a:hover{background:var(--surface-3); color:var(--ink)}
.mchip{display:flex; align-items:center; gap:5px; width:100%; border:1px solid; border-radius:3px; padding:2px 5px; font-size:11px; cursor:grab; text-align:left; white-space:nowrap; overflow:hidden}
.mchip b{font-family:var(--mono); font-weight:500; font-size:10.5px; flex:none}
.mchip span{overflow:hidden; text-overflow:ellipsis}
.mchip:hover{filter:brightness(.96)}
.mcal__m{border:none; background:none; color:var(--ink-3); font-size:11px; cursor:pointer; text-align:left; padding:1px 5px}
.mcal__m:hover{color:var(--bronze-deep)}

/* ─── панель видов — в шапке самого календаря ─── */
.schbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:11px 16px; border-bottom:1px solid var(--line); background:var(--surface-2); border-radius:6px 6px 0 0}
.schbar__r{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}

/* ─── неделя: колонка на день ─── */
.wag{display:grid; grid-template-columns:repeat(7,minmax(150px,1fr)); min-width:1070px; border-top:1px solid var(--line)}
.wag__h{border-left:1px solid var(--line); border-bottom:1px solid var(--line); padding:8px 10px 9px; text-align:center; background:var(--surface-2)}
.wag__h:first-child{border-left:none}
.wag__h b{display:block; font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:500; line-height:1.2}
.wag__h span{font-size:10.5px; color:var(--ink-3)}
.wag__h em{display:block; font-style:normal; font-family:var(--mono); font-size:10.5px; color:var(--ink-2); margin-top:3px}
.wag__h:hover{background:var(--surface-3)}
.wag__h--now{background:var(--bronze-wash)}
.wag__h--now b{color:var(--bronze-deep)}
.wag__h--flag{background:var(--bad-wash)}
.wag__h--flag b{color:var(--bad)}
.wag__c{border-left:1px solid var(--line); border-bottom:1px solid var(--line); padding:6px; display:flex; flex-direction:column; gap:5px; min-height:190px}
.wag__c:nth-child(7n+1){border-left:none}
.wag__c--we{background:var(--surface-2)}
.wag__c--out{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--paper) 6px 12px)}
.wag__c[data-drop="on"]{background:var(--bronze-wash); box-shadow:inset 0 0 0 1px var(--bronze)}
.wchip{border:1px solid; border-radius:4px; padding:5px 8px 6px; text-align:left; cursor:grab; display:block}
.wchip b{display:block; font-family:var(--mono); font-size:11px; font-weight:500}
.wchip span{display:block; font-size:12.5px; margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.wchip small{display:block; font-size:10.5px; opacity:.85; margin-top:2px; line-height:1.4}
.wchip:hover{filter:brightness(.97)}
.wag__add{margin-top:auto; border:1px dashed var(--line-2); background:none; border-radius:4px; color:var(--ink-3); cursor:pointer; font-size:12px; padding:7px 6px}
.wag__add:hover{border-color:var(--bronze); color:var(--bronze-deep)}

/* ─── день: сетка часов, колонка на сотрудника ─── */
.cal{display:grid; grid-template-columns:54px repeat(9,minmax(122px,1fr)); min-width:1150px; padding-bottom:16px}
.cal__corner{border-bottom:1px solid var(--line)}
.cal__h{border-left:1px solid var(--line); border-bottom:1px solid var(--line); padding:8px 8px 9px; text-align:center}
.cal__h b{display:block; font-size:13px; font-weight:600; line-height:1.25}
.cal__h span{font-size:10.5px; color:var(--ink-3)}
.cal__h em{display:block; font-style:normal; font-family:var(--mono); font-size:10px; color:var(--ink-2); margin-top:3px; white-space:nowrap}
.cal__gut{position:relative; height:var(--ch)}
.cal__gut i{position:absolute; right:8px; font-style:normal; font-family:var(--mono); font-size:10px; color:var(--ink-3); transform:translateY(-6px)}
.cal__col{position:relative; height:var(--ch); border-left:1px solid var(--line); background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hh))}
.cal__col[data-drop="on"]{background-color:var(--bronze-wash)}
.shb{position:absolute; border:1px solid; border-radius:4px; padding:4px 7px; overflow:hidden; text-align:left; cursor:grab; display:block}
.shb b{display:block; font-family:var(--mono); font-size:10.5px; font-weight:500}
.shb span{display:block; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px}
.shb small{display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; font-size:10px; opacity:.9; margin-top:3px; line-height:1.4; overflow:hidden}
.shb:hover{filter:brightness(.97)}
.shb--drag{opacity:.35}
.shb--new{animation:pop .32s ease both}
.evb{position:absolute; left:calc(34% + 2px); width:calc(66% - 6px); border:1px solid var(--bronze-line); background:#f4ecdf; color:var(--bronze-deep); border-radius:4px; padding:3px 6px; overflow:hidden; z-index:12}
.evb b{display:block; font-family:var(--mono); font-size:10px; font-weight:500}
.evb span{display:block; font-size:11.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.evb small{display:block; font-size:10px; opacity:.9; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.evb--tech{background:var(--surface-2); border-color:var(--line-2); border-style:dashed; color:var(--ink-2)}

/* ─── карточка смены ─── */
.f{margin-bottom:14px}
.f>label{display:block; font-size:12px; color:var(--ink-2); margin-bottom:5px}
.f input,.f select,.f textarea{width:100%; font:inherit; font-size:13px; color:var(--ink); background:var(--surface); border:1px solid var(--line-2); border-radius:5px; padding:7px 9px}
.f textarea{resize:vertical; line-height:1.5}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--bronze); outline-offset:1px; border-color:var(--bronze)}
.frow{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.fhint{margin:-7px 0 15px; font-size:12px; color:var(--ink-3)}
.fhint b{font-family:var(--mono); color:var(--ink-2); font-weight:500}
.fhint--bad{color:var(--bad)}
.fhint--bad b{color:var(--bad)}
.fsec{font-size:12.5px; font-weight:600; margin:22px 0 9px}
.tasks{list-style:none; margin:0 0 9px; padding:0}
.tasks li{display:grid; grid-template-columns:minmax(0,1fr) 26px; gap:6px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px}
.tasks label{display:flex; gap:9px; align-items:flex-start; cursor:pointer}
.tasks input{width:auto; margin-top:3px; accent-color:var(--bronze)}
.tasks li[data-done="1"] span{color:var(--ink-3); text-decoration:line-through}
.tasks .rm{border:none; background:none; color:var(--ink-3); cursor:pointer; font-size:16px; line-height:1; border-radius:4px; height:24px}
.tasks .rm:hover{background:var(--surface-2); color:var(--bad)}
.tasks .e{display:block; color:var(--ink-3); font-size:12.5px; border-bottom:none; padding:0 0 4px}
.tadd{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:7px}
.tadd input{font:inherit; font-size:13px; padding:7px 9px; border:1px solid var(--line-2); border-radius:5px; background:var(--surface); color:var(--ink)}
.chk{display:flex; gap:9px; align-items:flex-start; font-size:12.5px; color:var(--ink-2); margin:16px 0 20px; cursor:pointer}
.chk input{margin-top:2px; accent-color:var(--bronze)}
.facts{display:flex; gap:9px; flex-wrap:wrap; border-top:1px solid var(--line); padding-top:16px}
.dlist{list-style:none; margin:0; padding:0}
.dlist li{display:grid; grid-template-columns:auto minmax(0,1fr); gap:13px; align-items:start; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px}
.dlist li:last-child{border-bottom:none}
.dlist__t{font-family:var(--mono); font-size:11.5px; color:var(--ink-2); padding-top:1px}
.dlist__r{font-size:11.5px; color:var(--ink-3); display:block}
.dlist__b{width:3px; border-radius:2px; align-self:stretch}

/* ─── залы ─── */
.halls{display:grid; grid-template-columns:172px minmax(0,1fr); min-width:820px}
.halls__s{grid-column:2; display:grid; font-size:10.5px; color:var(--ink-3); padding-bottom:8px; font-family:var(--mono)}
.halls__n{display:flex; flex-direction:column; justify-content:center; padding:12px 12px 12px 0; border-top:1px solid var(--line)}
.halls__t{font-size:14px; font-weight:600; letter-spacing:.01em}
.halls__c{font-size:11px; color:var(--ink-3); margin-top:3px}
.halls__l{position:relative; border-top:1px solid var(--line); border-left:1px solid var(--line); min-height:66px; background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px var(--hs))}
.ev{position:absolute; top:7px; bottom:7px; border-radius:3px; padding:5px 8px; border:1px solid; overflow:hidden; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:1px; min-width:0}
.ev b{font-size:11.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ev small{font-size:10px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ev--show{background:var(--bronze-wash); border-color:var(--bronze-line); color:var(--bronze-deep)}
.ev--ban{background:var(--ok-wash); border-color:var(--ok-line); color:var(--ok)}
.ev--tech{background:var(--surface-2); border-color:var(--line); border-style:dashed; color:var(--ink-2)}

/* ─── список дел ─── */
.issues{list-style:none; margin:0; padding:0}
.issues li{display:grid; grid-template-columns:3px 1fr auto; gap:13px; align-items:start; padding:13px 16px; border-bottom:1px solid var(--line)}
.issues li:last-child{border-bottom:none}
.issues .bar{width:3px; align-self:stretch; border-radius:2px; background:var(--bad)}
.issues li[data-tone="warn"] .bar{background:var(--warn)}
.issues__t{font-size:13.5px; display:block}
.issues__r{font-size:12.5px; color:var(--ink-2); display:block; margin-top:3px}
.issues__r code{font-family:var(--mono); font-size:11.5px; background:var(--surface-2); padding:1px 5px; border-radius:3px}

/* ─── звонки ─── */
.calls{display:grid; grid-template-columns:minmax(0,300px) minmax(0,1fr); gap:0}
.clist{list-style:none; margin:0; padding:0; border-right:1px solid var(--line); max-height:620px; overflow:auto}
.crow{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; width:100%; padding:10px 14px; background:none; border:none; border-left:3px solid transparent; border-bottom:1px solid var(--line); cursor:pointer; text-align:left}
.crow:hover{background:var(--surface-2)}
.crow[aria-current="true"]{background:var(--bronze-wash); border-left-color:var(--bronze)}
.crow__w{font-size:13px; display:block}
.crow__m{font-size:11.5px; color:var(--ink-3); display:block; margin-top:2px; font-family:var(--mono)}
.crow__s{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:16px; font-weight:500}
.s-ok{color:var(--ok)} .s-w{color:var(--warn)} .s-b{color:var(--bad)}
.cdet{padding:16px}
/* таймлайн залит по темам разговора */
.tl{display:flex; height:26px; border-radius:3px; overflow:hidden; border:1px solid var(--line); margin:10px 0 7px; cursor:pointer}
.tl span{display:block; position:relative}
.tl span:hover{filter:brightness(.94)}
.tl__k{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-2); margin-bottom:16px}
.tl__k i{width:11px; height:11px; border-radius:2px; display:inline-block; margin-right:5px; vertical-align:-1px}
.tr{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px}
.tr li{display:grid; grid-template-columns:62px minmax(0,1fr); gap:11px; font-size:13px; align-items:start; cursor:pointer; border-radius:4px; padding:2px}
.tr li:hover{background:var(--surface-2)}
.tr li[data-on="1"]{background:var(--bronze-wash)}
.tr__w{font-family:var(--mono); font-size:11px; color:var(--ink-3); padding-top:7px}
.tr__x{padding:7px 11px; border-radius:4px; background:var(--surface-2); line-height:1.5; border-left:3px solid transparent}
.tr li[data-s="op"] .tr__x{background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--line)}
.tr li[data-s="good"] .tr__x{border-left-color:var(--ok)}
.tr li[data-s="bad"] .tr__x{border-left-color:var(--bad)}
.tr__f{display:block; font-size:11.5px; margin-top:5px; font-weight:500}
.tr li[data-s="good"] .tr__f{color:var(--ok)}
.tr li[data-s="bad"] .tr__f{color:var(--bad)}
.ck{list-style:none; margin:0; padding:0; font-size:13px}
.ck li{display:grid; grid-template-columns:16px 1fr auto; gap:9px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line)}
.ck li:last-child{border-bottom:none}
.ck .m{font-weight:600}
.ck .m.y{color:var(--ok)} .ck .m.n{color:var(--bad)}
.ck li[data-d="0"] span:nth-child(2){color:var(--ink-2)}
.ck .rate{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12px; color:var(--ink-3)}
/* целевой коридор рядом с метрикой */
.gauge{margin:0 0 18px; border:1px solid var(--line); border-radius:6px; padding:14px 16px 16px; background:var(--surface)}
.gauge__h{font-size:12.5px; font-weight:600; margin:0 0 12px}
.gauge__l{display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; color:var(--ink-2); margin-bottom:9px}
.gauge__l b{font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink); font-weight:500; font-size:19px}
.gauge__t{display:block; position:relative; height:14px; background:var(--surface-3); border-radius:3px}
.gauge__z{position:absolute; top:0; bottom:0; background:var(--ok-wash); border-left:2px solid var(--ok); border-right:2px solid var(--ok)}
.gauge__p{position:absolute; top:-5px; width:3px; height:24px; background:var(--ink); border-radius:2px}
.gauge__p.out{background:var(--bad)}
.gauge__sc{display:block; position:relative; height:15px; margin-top:4px; font-family:var(--mono); font-size:10.5px; color:var(--ink-3)}
.gauge__sc span{position:absolute; transform:translateX(-50%)}
.gauge__c{font-size:12.5px; color:var(--ink-2); margin-top:9px; display:block; line-height:1.5}
.gauge__c b{font-weight:600}
.gauge__c.out b{color:var(--bad)}

/* ─── панель справа ─── */
.sheet{position:fixed; inset:0; z-index:60; display:grid; grid-template-columns:1fr minmax(0,420px)}
.sheet__s{background:rgba(53,50,48,.3); border:none; cursor:pointer}
.sheet__p{position:relative; background:var(--surface); border-left:1px solid var(--line); padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px)); overflow:auto}
.sheet__c{position:absolute; top:14px; right:16px}
.kv{display:grid; grid-template-columns:auto 1fr; gap:8px 16px; font-size:13px; margin:0}
.kv dt{color:var(--ink-3); font-size:12.5px}
.kv dd{margin:0}
.kv dd.n{font-family:var(--mono); font-variant-numeric:tabular-nums}
.tline{list-style:none; margin:0; padding:0 0 0 16px; border-left:1px solid var(--line)}
.tline li{position:relative; padding:0 0 15px 14px; font-size:13px}
.tline li::before{content:""; position:absolute; left:-21px; top:6px; width:9px; height:9px; border-radius:50%; background:var(--surface); border:1px solid var(--line-2)}
.tline li[data-on="1"]::before{background:var(--bronze); border-color:var(--bronze)}
.tline__t{font-family:var(--mono); font-size:11px; color:var(--ink-3); display:block}

/* ─── источники ─── */
.src{display:grid; grid-template-columns:repeat(auto-fit,minmax(238px,1fr)); gap:14px; margin-bottom:22px}
.scard{border:1px solid var(--line); border-radius:6px; padding:15px; background:var(--surface); border-top:3px solid var(--line)}
.scard--a{border-top-color:var(--ok)}
.scard--p{border-top-color:var(--warn)}
.scard--m{border-top-color:var(--bad)}
.scard h3{margin:0; font-size:13.5px; font-weight:600}
.scard__n{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:27px; font-weight:500; display:block; margin:7px 0 6px}
.scard p{margin:0; font-size:12.5px; color:var(--ink-2); line-height:1.55}
.scard ul{margin:9px 0 0; padding-left:16px; font-size:12px; color:var(--ink-2); line-height:1.7}
.plan{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px}
.pcard{border:1px solid var(--line); border-radius:6px; padding:15px; background:var(--surface)}
.pcard b{display:block; margin-bottom:6px; font-size:13.5px}
.pcard p{margin:0; font-size:12.5px; color:var(--ink-2); line-height:1.6}

.tabbar{display:none}
@media (max-width:1000px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .strip,.head,.body{padding-left:15px; padding-right:15px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .calls{grid-template-columns:minmax(0,1fr)}
  .clist{border-right:none; border-bottom:1px solid var(--line); max-height:280px}
  .sheet{grid-template-columns:minmax(0,1fr)}
  .sheet__s{display:none}
  .sheet__p{border-left:none; border-top:1px solid var(--line); border-radius:10px 10px 0 0; margin-top:46px}
  .tr li{grid-template-columns:minmax(0,1fr); gap:3px}
  .tr__w{padding-top:0}
  .body{padding-bottom:40px}
  .mcal__s .q{display:none}
  .tabbar{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:4px; position:sticky; top:46px; z-index:45;
          padding:7px 8px; background:var(--surface); border-bottom:1px solid var(--line-2); box-shadow:0 6px 14px -10px rgba(53,50,48,.35)}
  .tabbar button{position:relative; height:40px; padding:0 2px; border:1px solid var(--line); border-radius:7px; background:var(--paper);
                 cursor:pointer; font-size:12.5px; font-weight:500; color:var(--ink-2); white-space:nowrap; overflow:visible}
  .tabbar button[aria-current="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper); font-weight:600}
  .tabbar button i{position:absolute; top:-6px; right:-3px; min-width:17px; height:17px; padding:0 4px; border-radius:9px;
                   background:var(--bad); color:#fff; font-style:normal; font-family:var(--mono); font-size:10px; line-height:17px; text-align:center}
}
/* ─── телефон: свои раскладки графика, таблицы карточками ─── */
.msort{display:none}
@media (max-width:640px){
  /* iOS приближает страницу, если у поля шрифт меньше 16px */
  input,select,textarea,.f input,.f select,.f textarea,.tadd input{font-size:16px!important}
  .seg{max-width:100%; overflow-x:auto; scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:none; white-space:nowrap; height:34px}
  .schbar{padding:10px 12px}
  .schbar .seg{width:100%}
  .schbar .seg button{flex:1 0 auto}
  .schbar__r{margin-left:0; width:100%}
  .schbar__r .btn{flex:1; justify-content:center; height:36px}
  .panel__h{padding:12px 14px}
  .panel__a{margin-left:0; width:100%}
  .panel__a .btn--q{flex:1; justify-content:center; border:1px solid var(--line); height:34px}
  .head__r{margin-left:0}
  .cols{grid-template-columns:minmax(0,1fr)}
  .issues li{grid-template-columns:3px minmax(0,1fr); padding:13px 14px}
  .issues li>.btn{grid-column:2; justify-self:start}
  .issues li>span:empty:not(.bar){display:none}
  .legend{gap:8px 16px; padding:12px 14px 0}
  .qm{width:20px; height:20px; font-size:11px}
  .fun li{grid-template-columns:minmax(96px,1fr) minmax(0,1fr) 44px; gap:9px}
  .clist{max-height:none}
  .msort{display:flex; align-items:center; gap:8px; width:100%; font-size:12.5px; color:var(--ink-2)}
  .msort select{flex:1; min-width:0; border:1px solid var(--line-2); border-radius:5px; background:var(--surface); color:var(--ink); padding:6px 8px}

  /* таблица → карточки: подпись столбца над значением */
  table.tcards,table.tcards tbody,table.tcards tfoot{display:block}
  table.tcards thead{display:none}
  table.tcards tr{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px 12px; padding:13px 14px; border-bottom:1px solid var(--line)}
  table.tcards td{display:block; height:auto; padding:0; border:none; white-space:normal; text-align:left!important; min-width:0; font-size:13.5px; background:none!important}
  table.tcards td::before{content:attr(data-l); display:block; font-family:var(--sans); font-size:11px; font-weight:400; color:var(--ink-3); margin-bottom:2px; line-height:1.3}
  table.tcards td.tc-t{grid-column:1/-1; font-size:14.5px; font-weight:500}
  table.tcards td.tc-t::before,table.tcards td.tc-n::before{display:none}
  table.tcards td.tc-w{grid-column:1/-1}
  table.tcards td:empty{display:none}
  table.tcards tr[data-hole="1"]{background:var(--warn-wash)}
  table.tcards tfoot tr{background:var(--surface-2); border-bottom:none; border-radius:0 0 6px 6px}
  table.tcards tfoot td{font-weight:600}
}

/* месяц на телефоне: компактная сетка + список смен выбранного дня */
.mm{display:grid; grid-template-columns:repeat(7,minmax(0,1fr))}
.mm__h{font-size:11px; color:var(--ink-3); text-align:center; padding:8px 0 6px; border-bottom:1px solid var(--line)}
.mm__c{border:none; background:none; border-bottom:1px solid var(--line); border-left:1px solid var(--line); min-height:58px; padding:5px 2px 6px; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; min-width:0}
.mm__c:nth-child(7n+1){border-left:none}
.mm__c--we{background:var(--surface-2)}
.mm__c--out{background:repeating-linear-gradient(135deg,var(--surface-2) 0 5px,var(--paper) 5px 10px); cursor:default}
.mm__n{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:14px; width:28px; height:28px; display:grid; place-items:center; border-radius:50%}
.mm__c--now .mm__n{color:var(--bronze-deep); font-weight:600; box-shadow:inset 0 0 0 1px var(--bronze)}
.mm__c[aria-pressed="true"] .mm__n{background:var(--ink); color:var(--paper); box-shadow:none}
.mm__c[aria-pressed="true"]{background:var(--bronze-wash)}
.mm__d{display:flex; flex-wrap:wrap; justify-content:center; gap:2px; max-width:34px}
.mm__d i{width:6px; height:6px; border-radius:50%; border:1px solid}
.mm__d i{background:currentColor; border-color:currentColor}
.mm__d i.draft{background:transparent}
.mm__e{font-size:9.5px; line-height:1; color:var(--bronze-deep); font-family:var(--mono)}
.mm__e--bad{color:var(--bad); font-weight:600}
.agenda{padding:14px 14px 4px}
.agenda__h{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px; margin:0 0 11px}
.agenda__h b{font-size:15px; font-weight:600}
.agenda__h span{font-size:12.5px; color:var(--ink-3)}
.agenda__l{display:flex; flex-direction:column; gap:6px}
.agenda__l .wchip{width:100%}
.agenda__ev{list-style:none; margin:12px 0 0; padding:0; font-size:13px}
.agenda__ev li{display:grid; grid-template-columns:48px minmax(0,1fr); gap:8px; padding:7px 0; border-top:1px solid var(--line)}
.agenda__ev .t{font-family:var(--mono); font-size:12px; color:var(--bronze-deep); padding-top:1px}
.agenda__ev small{display:block; font-size:11.5px; color:var(--ink-3)}
.agenda__b{display:flex; gap:8px; margin-top:14px}
.agenda__b .btn{flex:1; justify-content:center; height:38px}
.wag--m{grid-template-columns:minmax(0,1fr); min-width:0}
.wag--m .wag__h{border-left:none; display:flex; align-items:baseline; gap:9px; text-align:left; padding:10px 14px}
.wag--m .wag__h b{display:inline; font-size:16px}
.wag--m .wag__h em{display:inline; margin:0 0 0 auto}
.wag--m .wag__c{border-left:none; min-height:0; padding:8px 14px 12px}
.wag--m .wag__add{margin-top:2px}

/* день на телефоне: строка на сотрудника, полоса смены по часам */
.dm{padding:4px 14px 6px}
.dm__sc{position:relative; height:18px; margin:6px 0 0; font-family:var(--mono); font-size:10px; color:var(--ink-3)}
.dm__sc span{position:absolute; transform:translateX(-50%)}
.dm__sc span:first-child{transform:none}
.dm__sc span:last-child{transform:translateX(-100%)}
.dm__r{padding:11px 0 12px; border-top:1px solid var(--line)}
.dm__g{font-size:11px; color:var(--ink-3); padding:14px 0 2px}
.dm__t{display:flex; align-items:baseline; gap:8px; margin-bottom:7px}
.dm__t b{font-size:14px; font-weight:500}
.dm__t span{font-size:11.5px; color:var(--ink-3)}
.dm__t em{margin-left:auto; font-style:normal; font-family:var(--mono); font-size:12px; color:var(--ink-2); white-space:nowrap}
.dm__t em.off{color:var(--ink-3); font-family:var(--sans)}
.dm__k{position:relative; height:36px; border-radius:4px; background-color:var(--surface-2); background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px var(--hs)); cursor:pointer}
.dm__s{position:absolute; top:0; bottom:0; border:1px solid; border-radius:4px; padding:0 7px; font-family:var(--mono); font-size:11px; font-weight:500; display:flex; align-items:center; white-space:nowrap; overflow:hidden; cursor:pointer}
.dm__e{position:absolute; bottom:3px; height:11px; border-radius:2px; background:var(--bronze); opacity:.85; pointer-events:none; z-index:2}
.dm__e--tech{background:var(--ink-3)}
.dm__x{margin:7px 0 0; padding:0; list-style:none; font-size:12px; color:var(--ink-2)}
.dm__x li{display:flex; gap:7px; padding:1px 0}
.dm__x li b{font-family:var(--mono); font-weight:500; color:var(--bronze-deep); font-size:11.5px; flex:none}

/* сотрудники на телефоне: карточка с часами и полосой месяца */
.pm{padding:2px 14px 6px}
.pm__g{font-size:11px; color:var(--ink-3); padding:14px 0 2px}
.pm__r{padding:12px 0 13px; border-top:1px solid var(--line)}
.pm__t{display:flex; align-items:baseline; gap:8px}
.pm__t b{font-size:14px; font-weight:500}
.pm__t span{font-size:11.5px; color:var(--ink-3)}

var page='leads';
function buildNav(){
  var n=$('#nav'), b=$('#tabbar');
  PAGES.forEach(function(p){
    var x=el('button','slink','<span class="slink__b"></span><span>'+p.nav+'</span>'+(p.bad?'<span class="slink__c">'+p.bad+'</span>':''));
    x.type='button'; x.dataset.n=p.id; x.addEventListener('click',function(){go(p.id);}); n.appendChild(x);
    var t=el('button',null,'<span>'+p.nav.split(' ')[0]+'</span>'+(p.bad?'<i>'+p.bad+'</i>':''));
    t.type='button'; t.dataset.t=p.id; t.addEventListener('click',function(){go(p.id);}); b.appendChild(t);
  });
}
function go(id){
  page=id;
  PAGES.forEach(function(p){
    $('#v-'+p.id).hidden=(p.id!==id);
    $('[data-n="'+p.id+'"]').setAttribute('aria-current',p.id===id?'true':'false');
    $('[data-t="'+p.id+'"]').setAttribute('aria-current',p.id===id?'true':'false');
  });
  var p=PAGES.filter(function(x){return x.id===id;})[0];
  $('#pgT').textContent=p.t; $('#pgS').textContent=p.s;
  $('#pgA').innerHTML='';
  if(id==='leads') mountPeriod();
  if(id==='schedule') renderSched();
  window.scrollTo(0,0);
  if(id==='leads') chart();
}
document.addEventListener('click',function(e){
  var t=e.target; if(!t||!t.closest) return;
  var g=t.closest('[data-go]'); if(g) go(g.dataset.go);
});
function seg(items,cur,cb){
  var w=el('div','seg');
  items.forEach(function(i){
    var b=el('button',null,i.n); b.type='button';
    b.setAttribute('aria-pressed',i.id===cur?'true':'false');
    b.addEventListener('click',function(){cb(i.id);});
    w.appendChild(b);
  });
  return w;
}

var PER={week:{k:.24,n:'неделю'},month:{k:1,n:'месяц'},quarter:{k:2.9,n:'квартал'}};
var per='month', sk='l', sd=-1;
function mountPeriod(){
  $('#pgA').appendChild(seg([{id:'week',n:'Неделя'},{id:'month',n:'Месяц'},{id:'quarter',n:'Квартал'}],per,
    function(v){per=v; renderLeads(); mountPeriod();}));
}
function leadRows(){
  var k=PER[per].k;
  return CH.map(function(c){
    var r={n:c.n,hole:c.hole,how:c.how,d:c.d,l:Math.round(c.l*k),t:Math.round(c.t*k),s:Math.round(c.s*k),
           sp:Math.round(c.sp*k),rv:Math.round(c.rv*k)};
    r.sh=r.l?r.t/r.l*100:0; r.cv=r.l?r.s/r.l*100:0; r.cpl=r.t?r.sp/r.t:0;
    return r;
  });
}

   + '<span class="panel__s">сделок на этапе сейчас</span></div><div class="panel__b"><ul class="fun" id="fm"></ul></div></div>'

function kpi(k,v,d,q){return '<div class="kpi"><span class="kpi__k">'+k+(q?qm(q):'')+'</span><span class="kpi__v">'+v+'</span><span class="kpi__d">'+d+'</span></div>';}
function fun(id,data){
  var mx=Math.max.apply(null,data.map(function(d){return d.n;}))||1;
  $(id).innerHTML=data.map(function(d){
    return '<li'+(d.drop?' data-drop="1"':'')+'><span class="fun__l">'+d.l+'</span>'
      +'<span class="fun__t"><span class="fun__f" style="width:'+Math.max(d.n/mx*100,.8)+'%"></span></span>'
      +'<span class="fun__n">'+fmt(d.n)+'</span></li>';
  }).join('');
}
function chart(){
  var box=$('#ch'); if(!box) return;
  /* рисуем в реальную ширину блока: на телефоне подписи не сжимаются в нечитаемые */
  var W=Math.max(300,Math.round(box.clientWidth||700)), narrow=W<480;
  var H=narrow?262:238,L=30,R=W-30,T=12,B=178,mx=80,ms=8,n=SL.length,st=(R-L)/n;
  var every=Math.max(1,Math.ceil(40/st));
  function cx(i){return L+st*(i+.5);}
  function y(v){return B-v/mx*(B-T);}          /* левая шкала — заявки */
  function y2(v){return B-v/ms*(B-T);}         /* правая шкала — показы */
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;max-width:100%" role="img" aria-label="Заявки и показы площадки по дням">';
  [20,40,60,80].forEach(function(v,i){
    s+='<line x1="'+L+'" y1="'+y(v)+'" x2="'+R+'" y2="'+y(v)+'" stroke="#dfdad4" stroke-dasharray="2 4"/>'
     +'<text x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="10" font-family="IBM Plex Mono,monospace" fill="#9a938a">'+v+'</text>'
     +'<text x="'+(R+8)+'" y="'+(y(v)+4)+'" font-size="10" font-family="IBM Plex Mono,monospace" fill="#967850">'+((i+1)*2)+'</text>';
  });
  var bw=Math.min(st*.33,13), gap=2;
  SL.forEach(function(v,i){
    var h1=B-y(v), h2=B-y2(SS[i]);
    s+='<rect x="'+(cx(i)-bw-gap/2)+'" y="'+y(v)+'" width="'+bw+'" height="'+Math.max(h1,1)+'" fill="#353230">'
     +'<title>'+SD[i]+' — '+v+' заявок</title></rect>'
     +'<rect x="'+(cx(i)+gap/2)+'" y="'+y2(SS[i])+'" width="'+bw+'" height="'+Math.max(h2,1)+'" fill="#967850">'
     +'<title>'+SD[i]+' — показов площадки: '+SS[i]+'</title></rect>';
  });
  s+='<line x1="'+L+'" y1="'+B+'" x2="'+R+'" y2="'+B+'" stroke="#c9c2ba"/>';
  SD.forEach(function(l,i){ if((n-1-i)%every===0)
    s+='<text x="'+cx(i)+'" y="'+(B+16)+'" text-anchor="middle" font-size="10" font-family="IBM Plex Mono,monospace" fill="#9a938a">'+l+'</text>';});
  var lx=narrow?0:150, ly=narrow?20:0;
  s+='<g transform="translate('+L+',214)">'
   +'<rect x="0" y="-10" width="10" height="10" fill="#353230"/>'
   +'<text x="16" y="0" font-size="11" fill="#6b655e">Заявки, левая шкала</text>'
   +'<rect x="'+lx+'" y="'+(ly-10)+'" width="10" height="10" fill="#967850"/>'
   +'<text x="'+(lx+16)+'" y="'+ly+'" font-size="11" fill="#6b655e">Показы площадки, правая шкала</text></g></svg>';
  box.innerHTML=s;
}

function pivot(){ if(view==='week'){var d=curW*7+3; return d<1?1:(d>MD?MD:d);} return curD; }
function openDay(d){ curD=d; curW=wk(d); view='day'; renderSched(); }

/* ── счёт часов и смен: всё считается по реальному времени смены ── */
function dur(s){return s.t-s.f;}
function nh(x){return (Math.round(x*10)/10).toString().replace('.',',');}
function nhf(x){var v=Math.round(x*10)/10, i=Math.floor(v); return fmt(i)+(v>i?','+Math.round((v-i)*10):'');}
function emp(id){return EMP.filter(function(e){return e.id===id;})[0];}
function byId(sid){return SH.filter(function(s){return s.id===sid;})[0];}
function ofEmp(id){return SH.filter(function(s){return s.e===id;});}
function ofDay(d){return SH.filter(function(s){return s.d===d;}).sort(function(a,b){return a.f-b.f||a.t-b.t;});}
function has(id,d){return SH.some(function(s){return s.e===id&&s.d===d;});}
function hrs(id){return ofEmp(id).reduce(function(a,s){return a+dur(s);},0);}
function shf(id){return ofEmp(id).length;}
function dayH(d){return ofDay(d).reduce(function(a,s){return a+dur(s);},0);}
function shortn(n){var p=n.split(' '); return p.length>1? p[0]+' '+p[1].charAt(0)+'.' : n;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function tsk(n){return n+' '+pl(n,'задача','задачи','задач');}
function showsOn(d){return EV.filter(function(e){return e.d===d&&e.k==='show';}).length;}
function evOn(d){return EV.filter(function(e){return e.d===d;}).length;}
function mgrOn(d){return EMP.filter(function(e){return e.d==='mg'&&has(e.id,d);}).length;}

function issues(){
  var out=[];
  for(var d=1;d<=MD;d++){
    if(showsOn(d)>=3&&mgrOn(d)<2) out.push({d:d,tone:'bad',
      t:DW[wd(d)]+', '+d+' сентября: показов площадки — '+showsOn(d)+', менеджеров в смене — '+mgrOn(d),
      r:'Нарушено правило <code>на показ площадки нужен свободный менеджер</code>. Показ — последний шаг перед сделкой.'});
  }
  EMP.forEach(function(e){
    var run=0, hit=0;
    for(var d=1;d<=MD;d++){
      if(has(e.id,d)){run++; if(run>=6&&!hit) hit=d;} else run=0;
    }
    if(hit) out.push({d:hit,tone:'bad', t:e.n+': шестой день подряд без выходного',
      r:'Нарушено правило <code>не более пяти смен подряд</code>. К шестой смене заметно падает качество разговоров.'});
  });
  var over=EMP.filter(function(e){return hrs(e.id)>NORM;});
  if(over.length) out.push({d:null,tone:'warn',
    t:'Переработка у '+over.length+' '+pl(over.length,'сотрудника','сотрудников','сотрудников')+' за месяц',
    r:'Нарушено правило <code>норма месяца 176 часов</code>. '
      +over.map(function(e){return e.n+' — '+nh(hrs(e.id))+' ч';}).join(', ')+'.'});
  return out;
}

    + kpi('Черновики', dr+'<i> смен</i>', dr?'сотрудники их пока не видят':'всё опубликовано',

        return '<li data-tone="'+c.tone+'"><span class="bar"></span>'

          +(c.d?'<button class="btn" type="button" data-i="'+i+'">Открыть день</button>':'<span></span>')+'</li>';
      }).join('')+'</ul>'
    : '<div class="panel__b" style="color:var(--ok)">Все показы площадки обеспечены менеджерами, ни у кого нет шести смен подряд, переработок за месяц не осталось.</div>';
  h+='</div>';

  var bar='<div class="schbar" id="schA"></div>';
  var lg='<div class="legend">'
   + '<span><i class="dp-cc"></i>Колл-центр</span>'

/* ── месяц ── */
function month(){
  var g=$('#mc'); if(!g) return;
  g.innerHTML='';
  DW.forEach(function(n){ g.appendChild(el('div','mcal__h',n)); });
  var lead=wd(1), i;
  for(i=0;i<lead;i++) g.appendChild(el('div','mcal__c mcal__c--out',''));
  for(var d=1;d<=MD;d++){
    (function(d){
      var list=ofDay(d);
      var c=el('div','mcal__c'+(wd(d)>=5?' mcal__c--we':'')+(d===TODAY?' mcal__c--now':''));
      c.dataset.d=d;
      c.innerHTML='<div class="mcal__t"><span class="mcal__n">'+d+'</span>'
        +(list.length?'<span class="mcal__s"><i class="q">'+list.length+' '+pl(list.length,'смена','смены','смен')+' · </i>'+nh(dayH(d))+' ч</span>':'')
        +'<button class="mcal__a" type="button" title="Добавить смену на этот день">+</button></div>';
      $('.mcal__a',c).addEventListener('click',function(ev){ev.stopPropagation(); editShift(null,{d:d});});
      list.slice(0,3).forEach(function(s){
        var e=emp(s.e);
        var b=el('button','mchip dp-'+e.d+(s.pub?'':' draft'),'<b>'+hh(s.f)+'</b><span>'+esc(shortn(e.n))+'</span>');
        b.type='button'; b.draggable=true; b.dataset.s=s.id;
        b.title=e.n+', '+e.r+', '+hh(s.f)+'–'+hh(s.t)+' — '+nh(dur(s))+' ч'+(s.pub?'':' (черновик)');
        b.addEventListener('click',function(ev){ev.stopPropagation(); editShift(s.id);});
        b.addEventListener('dragstart',dstart); b.addEventListener('dragend',dend);
        c.appendChild(b);
      });
      if(list.length>3){
        var m=el('button','mcal__m','ещё '+(list.length-3)+' '+pl(list.length-3,'смена','смены','смен'));
        m.type='button'; m.addEventListener('click',function(ev){ev.stopPropagation(); openDay(d);});
        c.appendChild(m);
      }
      c.addEventListener('click',function(){openDay(d);});
      c.addEventListener('dragover',dover); c.addEventListener('dragleave',dleave);
      c.addEventListener('drop',function(ev){dropOn(ev,this,d,null,null);});
      g.appendChild(c);
    })(d);
  }
  var tail=(7-((lead+MD)%7))%7;
  for(i=0;i<tail;i++) g.appendChild(el('div','mcal__c mcal__c--out',''));
}

function wchip(s){
  var e=emp(s.e), nt=s.tasks.length;
  var b=el('button','wchip dp-'+e.d+(s.pub?'':' draft'),
    '<b>'+hh(s.f)+' – '+hh(s.t)+'</b><span>'+esc(e.n)+'</span>'
    +'<small>'+esc(e.r)+' · '+nh(dur(s))+' ч'+(nt?' · '+tsk(nt):'')+(s.pub?'':' · черновик')+'</small>');
  b.type='button'; b.draggable=true; b.dataset.s=s.id;
  b.addEventListener('click',function(ev){ev.stopPropagation(); editShift(s.id);});
  b.addEventListener('dragstart',dstart); b.addEventListener('dragend',dend);
  return b;
}

/* ── неделя: колонка на день, смены списком по времени ── */
function week(){
  var g=$('#wag'); if(!g) return;
  g.innerHTML='';
  var days=[]; for(var i=0;i<7;i++) days.push(curW*7+i);

  var mob=M(), HD=[], CC=[];
  days.forEach(function(d){
    var inM=d>=1&&d<=MD, n=inM?ofDay(d).length:0;
    var hd=el('div','wag__h'+(d===TODAY?' wag__h--now':'')+(flagD===d?' wag__h--flag':''),
      '<b>'+(inM?d:(d<1?31+d:d-MD))+'</b><span>'+DW[wd(d)]+'</span>'
      +'<em>'+(inM?(n?n+' '+pl(n,'смена','смены','смен')+' · '+nh(dayH(d))+' ч':'нет смен'):'—')+'</em>');
    if(inM) hd.addEventListener('click',function(){openDay(d);});
    if(inM) hd.style.cursor='pointer';
    HD.push(hd);
  });

  days.forEach(function(d){
    var inM=d>=1&&d<=MD;
    var c=el('div','wag__c'+(wd(d)>=5?' wag__c--we':'')+(inM?'':' wag__c--out'));
    c.dataset.d=d;
    if(inM){
      ofDay(d).forEach(function(s){ c.appendChild(wchip(s)); });
      var a=el('button','wag__add','Добавить смену'); a.type='button';
      a.addEventListener('click',function(ev){ev.stopPropagation(); editShift(null,{d:d});});
      c.appendChild(a);
      c.addEventListener('dragover',dover); c.addEventListener('dragleave',dleave);
      c.addEventListener('drop',function(ev){dropOn(ev,this,d,null,null);});
    }
    CC.push(c);
  });
  if(mob) days.forEach(function(d,i){ if(d>=1&&d<=MD){ g.appendChild(HD[i]); g.appendChild(CC[i]); } });
  else { HD.forEach(function(x){g.appendChild(x);}); CC.forEach(function(x){g.appendChild(x);}); }

  var f=days[0], l=days[6];
  $('#wl').textContent=(f<1?(31+f)+' августа':f+' сентября')+' — '+(l>MD?(l-MD)+' октября':l+' сентября');
  var wh=0,wc=0;
  days.forEach(function(d){ if(d>=1&&d<=MD){ wh+=dayH(d); wc+=ofDay(d).length; } });
  $('#wh').textContent=nh(wh)+' '+pl(Math.round(wh),'час','часа','часов')+', '+wc+' '+pl(wc,'смена','смены','смен');
  $('#wp').addEventListener('click',function(){curW=Math.max(0,curW-1); renderSched();});
  $('#wn').addEventListener('click',function(){curW=Math.min(4,curW+1); renderSched();});
}

  var g=$('#cal'); if(!g) return;

  g.style.setProperty('--ch',((HE-HB)*PXH)+'px');

  g.appendChild(el('div','cal__corner',''));
  EMP.forEach(function(e){
    var s=ofDay(curD).filter(function(x){return x.e===e.id;})[0];
    g.appendChild(el('div','cal__h cal__h--res','<b>'+esc(shortn(e.n))+'</b><span>'+esc(e.r)+'</span>'
      +'<em>'+(s?hh(s.f)+'–'+hh(s.t)+' · '+nh(dur(s))+' ч':'выходной')+'</em>'));
  });

  var gut=el('div','cal__gut');

  g.appendChild(gut);

  EMP.forEach(function(e){
    var col=el('div','cal__col');
    col.dataset.e=e.id;
    ofDay(curD).filter(function(x){return x.e===e.id;}).forEach(function(s){
      var top=(Math.max(s.f,HB)-HB)*PXH, hgt=(Math.min(s.t,HE)-Math.max(s.f,HB))*PXH-3;
      var nt=s.tasks.length;
      var b=el('button','shb dp-'+e.d+(s.pub?'':' draft'),
        '<b>'+hh(s.f)+' – '+hh(s.t)+'</b><span>'+nh(dur(s))+' ч'+(s.pub?'':', черновик')+'</span>'
        +(nt?'<small>'+tsk(nt)+'</small>':'')+(s.note?'<small>'+esc(s.note)+'</small>':''));
      b.type='button'; b.draggable=true; b.dataset.s=s.id;
      b.style.top=top+'px'; b.style.height=Math.max(hgt,24)+'px'; b.style.left='2px'; b.style.width='calc(100% - 6px)';
      b.title=e.n+', '+hh(s.f)+'–'+hh(s.t)+' — '+nh(dur(s))+' ч';
      b.addEventListener('click',function(ev){ev.stopPropagation(); editShift(s.id);});
      b.addEventListener('dragstart',dstart); b.addEventListener('dragend',dend);
      col.appendChild(b);
    });
    EV.filter(function(v){return v.d===curD&&v.w===e.n;}).forEach(function(v){
      var hl=HALL.filter(function(z){return z.id===v.h;})[0];
      var top=(Math.max(v.a,HB)-HB)*PXH, hgt=(Math.min(v.b,HE)-Math.max(v.a,HB))*PXH-3;
      var n=el('div','evb'+(v.k==='tech'?' evb--tech':''),
        '<b>'+hh(v.a)+'–'+hh(v.b)+'</b><span>'+esc(v.t)+'</span><small>'+hl.n+(v.x?', № '+v.x:'')+'</small>');
      n.style.top=top+'px'; n.style.height=Math.max(hgt,24)+'px';
      n.title=v.t+', '+hl.n+', '+hh(v.a)+'–'+hh(v.b);
      col.appendChild(n);
    });
    col.addEventListener('click',function(ev){
      if(ev.target!==this) return;
      var r=this.getBoundingClientRect(), f=snap((ev.clientY-r.top)/PXH+HB);
      editShift(null,{e:e.id, d:curD, f:f, t:Math.min(f+9,HE)});
    });
    col.addEventListener('dragover',dover); col.addEventListener('dragleave',dleave);
    col.addEventListener('drop',function(ev){dropOn(ev,this,curD,this.getBoundingClientRect(),e.id);});
    g.appendChild(col);
  });

  var n=ofDay(curD).length;
  $('#dl').textContent=curD+' сентября, '+DW[wd(curD)].toLowerCase()+(curD===TODAY?' — сегодня':'');
  $('#dh').textContent=n? n+' '+pl(n,'смена','смены','смен')+' · '+nh(dayH(curD))+' '+pl(Math.round(dayH(curD)),'час','часа','часов')
                          +(evOn(curD)?' · '+evOn(curD)+' '+pl(evOn(curD),'мероприятие','мероприятия','мероприятий')+' в залах':'')
                        : 'смен не поставлено';
  $('#dp1').addEventListener('click',function(){ if(curD>1){curD--; curW=wk(curD); renderSched();} });
  $('#dn1').addEventListener('click',function(){ if(curD<MD){curD++; curW=wk(curD); renderSched();} });
}
function snap(x){var v=Math.round(x*2)/2; return v<HB?HB:(v>HE-1?HE-1:v);}

/* ── перенос смены ── */
var drag=null;
function dstart(e){
  var r=this.getBoundingClientRect();
  drag={id:this.dataset.s, off:(e.clientY-r.top)/PXH};
  this.classList.add('shb--drag');
  try{e.dataTransfer.setData('text/plain','s'); e.dataTransfer.effectAllowed='move';}catch(x){}
}
function dend(){this.classList.remove('shb--drag'); drag=null;}
function dover(e){if(!drag)return; e.preventDefault(); this.dataset.drop='on';}
function dleave(){delete this.dataset.drop;}
function dropOn(e,node,d,rect,empId){
  e.preventDefault(); delete node.dataset.drop;
  if(!drag) return;
  var s=byId(drag.id); if(!s){drag=null; return;}
  var len=dur(s);
  if(rect){
    var f=snap((e.clientY-rect.top)/PXH-drag.off+HB);
    if(f+len>HE) f=HE-len;
    if(f<HB) f=HB;
    s.f=f; s.t=f+len;
  }
  if(empId) s.e=empId;
  s.d=d; drag=null; renderSched();
}

/* ── создание и правка смены ── */
function ph(v){var p=String(v||'').split(':'); var a=+p[0], m=+p[1]; return (isNaN(a)?0:a)+(isNaN(m)?0:m)/60;}
function editShift(sid,pre){
  pre=pre||{};
  var s=sid?byId(sid):null;
  var st={ e:s?s.e:(pre.e||EMP[0].id), d:s?s.d:(pre.d||TODAY),
           f:s?s.f:(pre.f!=null?pre.f:12), t:s?s.t:(pre.t!=null?pre.t:21),
           note:s?s.note:'', pub:s?s.pub:false,
           tasks:(s?s.tasks:[]).map(function(x){return {t:x.t,done:x.done};}) };

  var opts=DEPT.map(function(dp){
    return '<optgroup label="'+dp.n+'">'+EMP.filter(function(e){return e.d===dp.id;}).map(function(e){
      return '<option value="'+e.id+'"'+(e.id===st.e?' selected':'')+'>'+esc(e.n)+' — '+esc(e.r)+'</option>';
    }).join('')+'</optgroup>';
  }).join('');
  var days=''; for(var d=1;d<=MD;d++) days+='<option value="'+d+'"'+(d===st.d?' selected':'')+'>'+d+' сентября, '+DW[wd(d)]+'</option>';

  var b='<button class="btn btn--q sheet__c" type="button" id="xc">Закрыть</button>'
   +'<p style="margin:0 0 4px; font-size:12.5px; color:var(--ink-3)">График смен</p>'
   +'<h2 style="margin:0 0 20px; font-size:19px; font-weight:600">'+(s?'Смена':'Новая смена')+'</h2>'
   +'<div class="f"><label for="fe">Сотрудник</label><select id="fe">'+opts+'</select></div>'
   +'<div class="f"><label for="fd">Дата</label><select id="fd">'+days+'</select></div>'
   +'<div class="frow"><div class="f"><label for="ff">Начало</label><input type="time" id="ff" step="900" value="'+hh(st.f)+'"></div>'
   +'<div class="f"><label for="ft">Окончание</label><input type="time" id="ft" step="900" value="'+hh(st.t)+'"></div></div>'
   +'<p class="fhint" id="fh"></p>'
   +'<div class="f"><label for="fn">Заметка к смене</label><textarea id="fn" rows="3" placeholder="Например: гость юбилея просил встретить лично">'+esc(st.note)+'</textarea></div>'
   +'<p class="fsec">Задачи на смену</p><ul class="tasks" id="tl"></ul>'
   +'<div class="tadd"><input id="ti" placeholder="Что нужно сделать в эту смену"><button class="btn" type="button" id="tb">Добавить</button></div>'
   +'<label class="chk"><input type="checkbox" id="fp"'+(st.pub?' checked':'')+'><span>Опубликовать смену — сотрудник увидит её и задачи у себя в боте</span></label>'
   +'<div id="fev"></div>'
   +'<div class="facts">'
   +'<button class="btn btn--go" type="button" id="ok">'+(s?'Сохранить':'Поставить смену')+'</button>'
   +(s?'<button class="btn" type="button" id="del">Снять смену</button>':'')
   +'<button class="btn btn--q" type="button" id="no">Отмена</button></div>';

  sheet(b,function(p,close){
    var fe=$('#fe',p), fd=$('#fd',p), ff=$('#ff',p), ft=$('#ft',p), fn=$('#fn',p), fp=$('#fp',p), ok=$('#ok',p);

    function len(){return ph(ft.value)-ph(ff.value);}
    function hint(){
      var L=len(), id=fe.value, was=(s&&s.e===id)?dur(s):0;
      var tot=hrs(id)-was+(L>0?L:0);
      if(L<=0){
        $('#fh',p).className='fhint fhint--bad';
        $('#fh',p).innerHTML='Окончание смены должно быть позже начала.';
        ok.disabled=true; ok.style.opacity='.5'; return;
      }
      ok.disabled=false; ok.style.opacity='';
      $('#fh',p).className='fhint';

/* ── «разложить заново»: правила вместо ручной перекройки ── */
function autofill(){
  for(var d=1;d<=MD;d++){
    var g=0;
    while(showsOn(d)>=3&&mgrOn(d)<2&&g++<4){
      var free=EMP.filter(function(e){return e.d==='mg'&&!has(e.id,d);}).sort(function(a,b){return hrs(a.id)-hrs(b.id);});
      if(!free.length) break;
      SH.push(mk(free[0].id,d,free[0].f,free[0].t,false,
        'Смена добавлена автоматически: в этот день '+showsOn(d)+' показа площадки, а менеджеров не хватало.',[]));
    }
  }
  EMP.forEach(function(e){
    var g=0;
    while(hrs(e.id)>NORM&&g++<40){
      var mine=ofEmp(e.id).slice().sort(function(a,b){return evOn(a.d)-evOn(b.d);});
      var cut=null;
      for(var i=0;i<mine.length;i++){
        var s=mine[i];
        if(e.d==='mg'&&showsOn(s.d)>=3&&mgrOn(s.d)<=2) continue;
        cut=s; break;
      }
      if(!cut) break;
      SH=SH.filter(function(x){return x!==cut;});
    }
  });
  flagD=null; renderSched();
  Array.prototype.forEach.call(document.querySelectorAll('.shb, .mchip, .wchip'),function(n,i){
    n.classList.add('shb--new'); n.style.animationDelay=Math.min(i*16,600)+'ms';
  });
}

  }).join('')+'</div>';

  var out=c.wpm<100||c.wpm>180;
  function pos(v){return Math.min(Math.max((v-60)/160*100,0),100);}
  var gauge='<div class="gauge"><p class="gauge__h">Темп речи оператора — сравнение с коридором'+qm('<b>Коридор 100–180 слов в минуту — это настройка по умолчанию, а не отраслевой норматив.</b> Мы взяли его от темпа обычной разговорной речи: медленнее ста слов речь тянется, быстрее ста восьмидесяти клиент начинает переспрашивать. <i>Настоящий коридор посчитаем по вашим записям: возьмём разговоры, закончившиеся показом, и посмотрим, в каком темпе говорят те, у кого получается. Сам темп считается просто: слова оператора в расшифровке ÷ его время речи.</i>')+'</p>'
   +'<span class="gauge__l"><span>Говорил со скоростью</span><b>'+c.wpm+' слов в минуту</b></span>'
   +'<span class="gauge__t">'
   +'<span class="gauge__z" style="left:'+pos(100)+'%; right:'+(100-pos(180))+'%"></span>'
   +'<span class="gauge__p'+(out?' out':'')+'" style="left:'+pos(c.wpm)+'%"></span></span>'
   +'<span class="gauge__sc">'
   +'<span style="left:0%">60</span><span style="left:'+pos(100)+'%">100</span>'
   +'<span style="left:'+pos(180)+'%">180</span><span style="left:100%">220</span></span>'
   +'<span class="gauge__c'+(out?' out':'')+'">Зелёный коридор — от 100 до 180 слов в минуту, это настройка по умолчанию. '
   +(out
      ? (c.wpm>180?'<b>Оператор частит: клиент не успевает за речью и переспрашивает.</b>':'<b>Оператор говорит слишком медленно: клиент теряет нить.</b>')
      : 'Этот разговор в коридоре.')
   +'</span></div>';

  box.innerHTML='<div style="display:flex; align-items:baseline; gap:11px; flex-wrap:wrap">'
   +'<span class="num" style="font-size:17px; font-weight:500">'+c.tm+'</span>'
   +'<span style="font-size:13px; color:var(--ink-2)">'+c.op+', '+c.du+(c.x?', сделка № '+c.x:'')+'</span>'
   +'<span style="margin-left:auto"></span>'
   +'<span class="chip '+(c.sc>=80?'chip--ok':(c.sc>=60?'chip--warn':'chip--bad'))+'">'+c.sc+' из 100</span>'+qm('<b>Балл собирается из трёх частей:</b> выполнение пунктов скрипта — 70 баллов, темп речи и паузы — 15, реакция на прямые запросы клиента — 15. <i>Веса предложены нами и согласуются с вами на внедрении. В этом макете баллы проставлены рукой.</i>')+'</div>'
   + gauge + tl + lg
   +'<div class="cols" style="gap:24px">'
   +'<div><p style="margin:0 0 9px; font-size:12.5px; font-weight:600">Расшифровка</p><ul class="tr" id="trl">'
   + c.ln.map(function(l,i){
       return '<li data-s="'+(l[2]||(l[0]==='Оператор'?'op':''))+'" data-i="'+i+'">'
         +'<span class="tr__w">'+l[0]+'</span><span class="tr__x">'+l[1]
         +(l[3]?'<span class="tr__f">'+(l[2]==='good'?'✓ ':'✗ ')+l[3]+'</span>':'')+'</span></li>';
     }).join('')
   +'</ul></div>'
   +'<div><p style="margin:0 0 9px; font-size:12.5px; font-weight:600">Скрипт продаж, '+done+' из '+SCR.length+qm('Процент справа — как часто этот пункт выполняется во всех разговорах смены, а не в этом одном. Галочка или крестик слева — про текущий разговор.')+'</p><ul class="ck">'
   + SCR.map(function(s,i){var y=c.dn[i]===1;
       return '<li data-d="'+(y?1:0)+'"><span class="m '+(y?'y':'n')+'">'+(y?'✓':'✗')+'</span><span>'+s+'</span>'
         +'<span class="rate">'+RATE[i]+'% по смене</span></li>';
     }).join('')
   +'</ul><p style="margin:20px 0 8px; font-size:12.5px; font-weight:600">Вывод</p>'
   +'<p style="margin:0; font-size:13px; color:var(--ink-2); line-height:1.6">'+c.v+'</p></div></div>';

  Array.prototype.forEach.call(document.querySelectorAll('#trl li'),function(li){
    li.addEventListener('click',function(){
      Array.prototype.forEach.call(document.querySelectorAll('#trl li'),function(x){x.removeAttribute('data-on');});
      this.setAttribute('data-on','1');

/* ══ 4. КЛИЕНТЫ ══ */
var clf='all';
function clMatch(c){
  if(clf==='all')return true;
  if(clf==='work')return ['Показ площадки','Отправлено КП','Квалификация'].indexOf(c.st)>=0;
  if(clf==='stuck')return c.m==='не назначен';
  if(clf==='won')return c.st==='Бронь';
  return true;
}
function renderClients(){
  var bk=CLI.filter(function(c){return c.st==='Бронь';});
  var st=CLI.filter(function(c){return c.m==='не назначен';});
  var sum=bk.reduce(function(a,c){return a+c.b;},0);
  var gs=CLI.reduce(function(a,c){return a+c.p;},0);
  var h='<div class="kpis">'
   + kpi('Обращений в работе',String(CLI.length),'за сентябрь','Сделки в АмоСRM за сентябрь, кроме закрытых. Одно обращение = одна сделка, даже если клиент звонил несколько раз.')
   + kpi('Забронировано',String(bk.length),fmt(sum)+' ₽ подтверждённой выручки','Сделки на этапе «Бронь» и сумма их бюджетов. <b>В вашей CRM поле суммы пустое у всех сделок</b>, поэтому здесь бюджет посчитан по числу гостей и формату — это оценка, а не факт. Чтобы цифра стала настоящей, сумму нужно вести в сделке.')
   + kpi('Без менеджера',String(st.length),'<b class="down">висят более суток</b>','Обращения без ответственного в карточке, которые висят дольше суток с момента обращения. Именно здесь заявки теряются на передаче из CRM в чат.')
   + kpi('Гостей в заявках',fmt(gs),'в среднем '+Math.round(gs/CLI.length)+' на мероприятие','Сумма поля «гостей» по всем обращениям месяца. Среднее = сумма ÷ число обращений. По этому полю видно, какие залы вообще нужны спросу.')
   + '</div>';
  h+='<div class="note">Клиенты и суммы вымышленные. Бюджеты посчитаны по числу гостей и формату — '
   + 'в вашей АмоCRM это поле пустое у всех сделок, поэтому настоящих сумм взять неоткуда.</div>';
  h+='<div class="panel"><div class="panel__h"><p class="panel__t">Обращения</p>'
   + '<div class="panel__a" id="clf"></div></div><div class="panel__b panel__b--flush">'
   + '<div class="scroll"><table id="clt"><thead><tr><th>Клиент</th><th>Обратился</th><th>Источник</th>'
   + '<th>Мероприятие</th><th>Дата события</th><th class="r">Гостей</th><th class="r">Бюджет</th>'
   + '<th>Этап</th><th>Менеджер</th></tr></thead><tbody></tbody></table></div></div></div>';
  $('#v-clients').innerHTML=h;
  clFilter(); clTable();
}
function clFilter(){
  var w=$('#clf'); w.innerHTML='';
  w.appendChild(seg(CLF.map(function(f){
    var old=clf; clf=f.id; var n=CLI.filter(clMatch).length; clf=old;
    return {id:f.id,n:f.n+' '+n};
  }),clf,function(v){clf=v; clFilter(); clTable();}));
}
function clTable(){
  var rows=CLI.filter(clMatch);
  $('#clt tbody').innerHTML=rows.map(function(c){
    var t=STG[c.st]||'flat', no=c.m==='не назначен';
    return '<tr data-cl="'+c.id+'" style="cursor:pointer"><td><b style="font-weight:500">'+c.n+'</b>'
      +'<span class="num" style="display:block; font-size:11px; color:var(--ink-3)">№ '+c.id+'</span></td>'
      +'<td class="num">'+c.g+'</td>'
      +'<td>'+(c.c==='Без метки канала'?'<span class="chip chip--warn">Без метки</span>':c.c)+'</td>'
      +'<td>'+c.e+'</td><td class="num">'+c.dt+'</td><td class="r">'+c.p+'</td><td class="r">'+rub(c.b)+'</td>'
      +'<td><span class="chip chip--'+t+'">'+c.st+'</span></td>'
      +'<td'+(no?' style="color:var(--bad); font-weight:500"':'')+'>'+c.m+'</td></tr>';
  }).join('')||'<tr><td colspan="9" style="color:var(--ink-3)">В этой выборке обращений нет.</td></tr>';
  tcards($('#clt'));
  Array.prototype.forEach.call(document.querySelectorAll('[data-cl]'),function(tr){
    tr.addEventListener('click',function(){openClient(+this.dataset.cl);});
  });
}
function openClient(id){
  var c=CLI.filter(function(x){return x.id===id;})[0]; if(!c)return;
  var t=STG[c.st]||'flat';
  var b='<button class="btn btn--q sheet__c" type="button" id="sc">Закрыть</button>'
   +'<p class="num" style="margin:0 0 4px; font-size:12px; color:var(--ink-3)">Сделка № '+c.id+'</p>'
   +'<h2 style="margin:0 0 11px; font-size:19px; font-weight:600">'+c.n+'</h2>'
   +'<span class="chip chip--'+t+'">'+c.st+'</span>'
   +'<dl class="kv" style="margin-top:18px"><dt>Мероприятие</dt><dd>'+c.e+'</dd>'
   +'<dt>Дата события</dt><dd class="n">'+c.dt+'</dd><dt>Гостей</dt><dd class="n">'+c.p+'</dd>'
   +'<dt>Бюджет</dt><dd class="n">'+rub(c.b)+'</dd><dt>Источник</dt><dd>'+c.c+'</dd>'
   +'<dt>Обратился</dt><dd class="n">'+c.g+' сентября</dd>'
   +'<dt>Менеджер</dt><dd'+(c.m==='не назначен'?' style="color:var(--bad); font-weight:500"':'')+'>'+c.m+'</dd></dl>'
   +'<p style="margin:22px 0 9px; font-size:12.5px; font-weight:600">История работы</p>'
   +'<ul class="tline">'+c.tl.map(function(x){
       return '<li data-on="'+x[2]+'"><span class="tline__t">'+x[0]+'</span>'+x[1]+'</li>';
     }).join('')+'</ul>';
  sheet(b,function(p,close){ $('#sc',p).addEventListener('click',close); });
}

/* ══ 5. ИСТОЧНИКИ ══ */
function renderSources(){
  var g={api:0,part:0,man:0}; SRC.forEach(function(r){g[r.s]++;});
  var h='<p style="margin:-4px 0 14px; font-size:13px; color:var(--ink-2)">Сколько каналов в какую группу попало'+qm('Считаем каналы из вашего списка по способу подключения. <b>Это не выдумка:</b> каждый канал мы проверили по его публичной документации и личному кабинету на 23 сентября 2026 года. Если площадка откроет API позже, канал переедет в первую группу.')+'</p><div class="src">'
   +'<div class="scard scard--a"><h3>Забираем автоматически</h3><span class="scard__n">'+g.api+'</span>'
   +'<p>Официальный программный доступ. Данные приходят сами, без участия людей.</p>'
   +'<ul><li>АмоCRM — сделки, воронки, история</li><li>Яндекс.Директ — расход и клики</li>'
   +'<li>Метрика — визиты и связка с заявкой</li><li>Телефония — записи разговоров</li></ul></div>'
   +'<div class="scard scard--p"><h3>Подключаем обходом</h3><span class="scard__n">'+g.part+'</span>'
   +'<p>Своего интерфейса у площадки нет, но данные добываются надёжно — номером, письмом или меткой.</p>'
   +'<ul><li>2GIS — подменный номер и метка</li><li>Горько.ру — разбор писем</li>'
   +'<li>Рестоклаб — их коллтрекинг</li><li>СМИ — метка и кодовое слово</li></ul></div>'
   +'<div class="scard scard--m"><h3>Остаётся за человеком</h3><span class="scard__n">'+g.man+'</span>'
   +'<p>Технических способов нет. Закрывается регламентом и полем в карточке сделки.</p>'
   +'<ul><li>Zoon — свой номер поставить нельзя</li><li>4банкет — заявку передаёт их менеджер</li>'
   +'<li>Офлайн — вывеска и рекомендации</li></ul></div></div>';

  h+='<div class="panel"><div class="panel__h"><p class="panel__t">Канал за каналом</p></div>'
   +'<div class="panel__b panel__b--flush"><div class="scroll"><table id="srt"><thead><tr>'
   +'<th>Источник</th><th>Как получаем</th><th>Что именно</th><th>Задержка'+qm('Через сколько данные оказываются у нас после события. У рекламных кабинетов это их собственный срок обновления статистики, у звонков и писем — почти мгновенно. Сроки взяты из документации площадок.')+'</th><th>Статус</th>'
   +'</tr></thead><tbody>'
   + SRC.map(function(r){var w=HOW[r.s];
       return '<tr'+(r.s==='man'?' data-hole="1"':'')+'><td><b style="font-weight:500">'+r.c+'</b></td>'
         +'<td class="wrapok" style="color:var(--ink-2)">'+r.h+'</td>'
         +'<td class="wrapok" style="color:var(--ink-2)">'+r.w+'</td>'
         +'<td>'+r.l+'</td><td><span class="chip '+w.c+'">'+w.t+'</span></td></tr>';
     }).join('')
   +'</tbody></table></div></div></div>';

  h+='<div class="panel"><div class="panel__h"><p class="panel__t">Что делаем с тем, что не отследить</p>'
   +'<span class="panel__s">часть гостей приходит «просто так» — это нормально, ненормально терять их в общей куче</span></div>'
   +'<div class="panel__b"><div class="plan">'
   + PLAN.map(function(p){return '<div class="pcard"><b>'+p[0]+'</b><p>'+p[1]+'</p></div>';}).join('')
   +'</div></div></div>';

  h+='<div class="note" style="background:var(--ok-wash); border-color:var(--ok-line); color:#255c3d">'
   +'<b>Проверяемая цель: снизить долю заявок без источника и удерживать её.</b> '
   +'Показатель считается ежедневно и выводится на первый экран. Точную цель в процентах назовём после '
   +'первого замера — сейчас никто не знает, какая эта доля сегодня.</div>';
  $('#v-sources').innerHTML=h;
  tcards($('#srt'),[1,2]);
}

/* ══ панель ══ */
function sheet(html,wire){
  var s=el('div','sheet');
  var sc=el('button','sheet__s'); sc.type='button'; sc.setAttribute('aria-label','Закрыть');
  var p=el('div','sheet__p',html);
  s.appendChild(sc); s.appendChild(p); document.body.appendChild(s);
  function close(){s.remove();}
  sc.addEventListener('click',close);
  wire(p,close);
}
